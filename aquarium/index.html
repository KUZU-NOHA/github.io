<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水槽の水位シミュレータ</title>
<style>
  :root {
    --bg:#f3f7fa; --card:#fff; --ink:#1d2b36; --sub:#5b6b78; --line:#d5dee5;
    --water:#4aa8e0; --water-d:#2a7fb8; --in:#1f8f5f; --out:#d6492f; --glass:#8fb4c9; --pipe:#9aa7b0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181e; --card:#18232b; --ink:#e6eef3; --sub:#93a5b2; --line:#2c3b46;
      --in:#3fc48a; --out:#ff7a5f; --glass:#5d8499; --pipe:#6d7b85; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.5; }
  header { padding:20px 16px 4px; max-width:1000px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 2px; }
  header p { margin:0; color:var(--sub); font-size:.9rem; }
  main { max-width:1000px; margin:0 auto; padding:12px 16px 32px; display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:800px){ main { grid-template-columns:1.2fr 1fr; } .wide{grid-column:1/-1;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h2 { font-size:1rem; margin:0 0 8px; }
  svg { width:100%; height:auto; display:block; }
  .flow { stroke-dasharray:10 8; animation:fl .5s linear infinite; }
  @keyframes fl { to { stroke-dashoffset:-18; } }
  .status { margin-top:8px; padding:8px 12px; border-radius:8px; background:var(--bg); font-weight:700; text-align:center; }
  .status.up { color:var(--in); } .status.down { color:var(--out); }
  .readout { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .readout div { background:var(--bg); border-radius:8px; padding:8px; text-align:center; }
  .readout b { display:block; font-size:1.25rem; font-variant-numeric:tabular-nums; }
  .readout span { font-size:.75rem; color:var(--sub); }
  label { display:flex; justify-content:space-between; font-size:.85rem; margin-top:10px; }
  label output { font-variant-numeric:tabular-nums; color:var(--sub); }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:10px 0 0; padding:0 10px 10px; }
  legend { font-size:.85rem; font-weight:700; padding:0 4px; }
  fieldset.in legend { color:var(--in); } fieldset.out legend { color:var(--out); }
  fieldset.in input { accent-color:var(--in); } fieldset.out input { accent-color:var(--out); }
  input[type=range] { width:100%; accent-color:var(--water-d); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--water-d); color:#fff; border-color:var(--water-d); }
  .eq { font-size:.9rem; background:var(--bg); border-radius:8px; padding:8px 10px; margin-top:10px; font-variant-numeric:tabular-nums; }
  .hint { font-size:.8rem; color:var(--sub); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>水槽の水位シミュレータ</h1>
  <p>蛇口から入る水と排水口から出る水。その差で水面の高さが決まります。</p>
</header>

<main>
  <section class="card">
    <h2>水槽</h2>
    <svg id="tank" viewBox="0 0 520 400" role="img" aria-label="蛇口と排水口のある水槽"></svg>
    <div id="status" class="status"></div>
    <div class="readout">
      <div><b id="rH">0</b><span>水面の高さ (cm)</span></div>
      <div><b id="rV">0</b><span>水の量 (L)</span></div>
      <div><b id="rT">0</b><span>経過時間 (分)</span></div>
    </div>
  </section>

  <section class="card">
    <h2>設定</h2>
    <fieldset class="in"><legend>🚰 蛇口（入る水）</legend>
      <label>1分あたり <output id="oIn"></output></label>
      <input id="qin" type="range" min="0" max="20" step="0.5" value="8">
    </fieldset>
    <fieldset class="out"><legend>🕳 排水口（出る水）</legend>
      <label>1分あたり <output id="oOut"></output></label>
      <input id="qout" type="range" min="0" max="20" step="0.5" value="3">
    </fieldset>
    <fieldset><legend>水槽の大きさ・はじめの水位</legend>
      <label>幅 <output id="oW"></output></label>
      <input id="w" type="range" min="20" max="120" value="60">
      <label>奥行き <output id="oD"></output></label>
      <input id="d" type="range" min="20" max="60" value="30">
      <label>高さ <output id="oH"></output></label>
      <input id="H" type="range" min="20" max="80" value="40">
      <label>はじめの水位 <output id="oI"></output></label>
      <input id="h0" type="range" min="0" max="40" step="0.5" value="10">
    </fieldset>
    <div class="row">
      <button id="play" class="primary">▶ スタート</button>
      <button id="reset">リセット</button>
    </div>
    <div class="eq" id="eq"></div>
  </section>

  <section class="card wide">
    <h2>グラフ：時間と水面の高さ</h2>
    <svg id="graph" viewBox="0 0 700 260" role="img" aria-label="時間と水面の高さのグラフ"></svg>
    <div class="hint">実線は実際の水位の記録、点線はこのまま続けた場合の予想です。傾きは「1分あたりに変わる水面の高さ」。入る量と出る量が同じなら水平になります。</div>
  </section>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const S = { w:60, d:30, H:40, qin:8, qout:3, h0:10, t:0, h:10, playing:false, hist:[[0,10]] };
  const SPEED = 1;                       // 実時間1秒 = シミュレーション1分

  const el = (name, attrs, parent) => {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const area = () => S.w * S.d;                    // 底面積 cm²
  const net = () => (S.qin - S.qout) * 1000 / area();   // 水位の変化 cm/分
  // 実際に出ていく量：空のときは出ない
  const outNow = () => (S.h <= 0 && S.qin <= S.qout) ? S.qin : S.qout;

  /* ---------- 水槽 ---------- */
  const tank = $('tank');
  const TX = 130, TW = 250, TY = 90, TH = 230;

  function stream(parent, x, y1, y2, rate, color) {
    if (rate <= 0 || y2 <= y1) return;
    el('line', { x1:x, x2:x, y1, y2, stroke:color, 'stroke-width':3 + rate * 1.1,
      'stroke-linecap':'butt', opacity:.85, class:'flow' }, parent);
  }

  function drawTank() {
    tank.innerHTML = '';
    const scale = Math.min(TW / S.w, TH / S.H);
    const pw = S.w * scale, ph = S.H * scale;
    const x0 = TX + (TW - pw) / 2, yb = TY + TH, yTop = yb - ph;
    const yw = yb - ph * (S.h / S.H);
    const full = S.h >= S.H - 1e-6;
    const inActive = S.qin > 0;
    const outActive = S.qout > 0 && (S.h > 0 || S.qin > 0);

    const defs = el('defs', {}, tank);
    const g = el('linearGradient', { id:'wg', x1:0, y1:0, x2:0, y2:1 }, defs);
    el('stop', { offset:'0', 'stop-color':css('--water'), 'stop-opacity':.65 }, g);
    el('stop', { offset:'1', 'stop-color':css('--water-d'), 'stop-opacity':.9 }, g);

    // 蛇口（上から）
    const fx = x0 + pw * 0.35, fy = yTop - 38;
    el('rect', { x:fx - 60, y:fy - 26, width:70, height:14, rx:5, fill:css('--pipe') }, tank);
    el('rect', { x:fx - 12, y:fy - 14, width:24, height:22, rx:4, fill:css('--pipe') }, tank);
    el('rect', { x:fx - 4, y:fy - 38, width:8, height:12, fill:css('--pipe') }, tank);
    el('rect', { x:fx - 14, y:fy - 44, width:28, height:7, rx:3, fill:css('--in') }, tank);
    if (inActive) stream(tank, fx, fy + 8, S.h > 0 ? yw : yb, S.qin, css('--water'));

    // 水
    el('rect', { x:x0, y:yw, width:pw, height:yb - yw, fill:'url(#wg)' }, tank);
    el('line', { x1:x0, x2:x0 + pw, y1:yw, y2:yw, stroke:css('--water-d'), 'stroke-width':2.5 }, tank);

    // 排水口（右下）
    el('rect', { x:x0 + pw - 2, y:yb - 26, width:36, height:20, fill:css('--pipe') }, tank);
    el('rect', { x:x0 + pw + 22, y:yb - 26, width:14, height:46, fill:css('--pipe') }, tank);
    el('rect', { x:x0 + pw + 18, y:yb + 18, width:22, height:6, rx:2, fill:css('--out') }, tank);
    if (outActive) stream(tank, x0 + pw + 29, yb + 24, yb + 70, S.qout, css('--water'));
    // 排水口の中の栓の状態
    el('circle', { cx:x0 + pw - 6, cy:yb - 16, r:6, fill:S.qout > 0 ? css('--out') : css('--pipe'), opacity:.9 }, tank);

    // ガラス
    el('path', { d:`M${x0} ${yTop} V${yb} H${x0 + pw} V${yTop}`, fill:'none',
      stroke:css('--glass'), 'stroke-width':5, 'stroke-linejoin':'round' }, tank);

    // あふれ
    if (full && S.qin > S.qout) {
      const t = el('text', { x:x0 + pw / 2, y:yTop - 6, 'text-anchor':'middle', 'font-size':14, 'font-weight':700, fill:css('--out') }, tank);
      t.textContent = '⚠ あふれる！';
    }

    // 目盛
    const step = S.H > 50 ? 10 : 5;
    for (let v = 0; v <= S.H; v += step) {
      const y = yb - v * scale;
      el('line', { x1:x0 - 8, x2:x0 - 2, y1:y, y2:y, stroke:css('--sub') }, tank);
      el('text', { x:x0 - 12, y:y + 4, 'text-anchor':'end', 'font-size':11, fill:css('--sub') }, tank).textContent = v;
    }
    // 水位の寸法線（左側）
    const hx = x0 - 46;
    el('line', { x1:hx, x2:hx, y1:yb, y2:yw, stroke:css('--water-d'), 'stroke-width':2 }, tank);
    el('line', { x1:hx - 5, x2:hx + 5, y1:yw, y2:yw, stroke:css('--water-d'), 'stroke-width':2 }, tank);
    const lab = el('text', { x:hx - 8, y:(yb + yw) / 2 + 4, 'text-anchor':'end', 'font-size':14, 'font-weight':700, fill:css('--water-d') }, tank);
    lab.textContent = S.h.toFixed(1) + ' cm';

    // 入る量・出る量ラベル
    const li = el('text', { x:fx + 22, y:fy - 22, 'font-size':14, 'font-weight':700, fill:css('--in') }, tank);
    li.textContent = `入る ${S.qin} L/分`;
    const lo = el('text', { x:x0 + pw + 48, y:yb + 40, 'font-size':14, 'font-weight':700, fill:css('--out') }, tank);
    lo.textContent = `出る ${S.qout} L/分`;

    el('text', { x:x0 + pw / 2, y:yb + 22, 'text-anchor':'middle', 'font-size':12, fill:css('--sub') }, tank)
      .textContent = `幅 ${S.w} × 奥行き ${S.d} × 高さ ${S.H} cm`;

    // 入る・出るの量の比較バー（左上）
    const bx = 14, by = 14, bw = 90, mx = 20;
    [['入る', S.qin, '--in'], ['出る', S.qout, '--out']].forEach(([n, q, c], i) => {
      const y = by + i * 22;
      el('text', { x:bx, y:y + 12, 'font-size':12, fill:css('--sub') }, tank).textContent = n;
      el('rect', { x:bx + 30, y, width:bw, height:14, rx:3, fill:css('--bg') }, tank);
      el('rect', { x:bx + 30, y, width:bw * q / mx, height:14, rx:3, fill:css(c) }, tank);
    });
  }

  /* ---------- グラフ ---------- */
  const graph = $('graph');
  function drawGraph() {
    graph.innerHTML = '';
    const L = 56, R = 20, T = 18, B = 40, W = 700, Hh = 260;
    const pw = W - L - R, ph = Hh - T - B;
    const tmax = Math.max(10, Math.ceil((S.t + 1) / 5) * 5);
    const X = t => L + t / tmax * pw;
    const Y = h => T + ph - h / S.H * ph;
    const sub = css('--sub'), line = css('--line');
    const hs = S.H > 50 ? 10 : 5, ts = tmax > 30 ? 10 : tmax > 15 ? 5 : 2;

    for (let v = 0; v <= S.H; v += hs) {
      el('line', { x1:L, x2:L + pw, y1:Y(v), y2:Y(v), stroke:line }, graph);
      el('text', { x:L - 8, y:Y(v) + 4, 'text-anchor':'end', 'font-size':11, fill:sub }, graph).textContent = v;
    }
    for (let t = 0; t <= tmax; t += ts) {
      el('line', { x1:X(t), x2:X(t), y1:T, y2:T + ph, stroke:line }, graph);
      el('text', { x:X(t), y:T + ph + 16, 'text-anchor':'middle', 'font-size':11, fill:sub }, graph).textContent = t;
    }
    el('text', { x:L + pw / 2, y:Hh - 6, 'text-anchor':'middle', 'font-size':12, fill:sub }, graph).textContent = '時間（分）';
    el('text', { x:14, y:T + ph / 2, 'font-size':12, fill:sub, transform:`rotate(-90 14 ${T + ph / 2})`, 'text-anchor':'middle' }, graph).textContent = '水面の高さ (cm)';
    el('line', { x1:L, x2:L + pw, y1:Y(S.H), y2:Y(S.H), stroke:css('--out'), 'stroke-dasharray':'5 4' }, graph);

    // 予想（点線）
    const a = net();
    let tEnd = tmax;
    if (a > 0) tEnd = Math.min(tmax, S.t + (S.H - S.h) / a);
    else if (a < 0) tEnd = Math.min(tmax, S.t + S.h / -a);
    if (a === 0) tEnd = tmax;
    const hEnd = Math.max(0, Math.min(S.H, S.h + a * (tEnd - S.t)));
    let d = `M${X(S.t)} ${Y(S.h)} L${X(tEnd)} ${Y(hEnd)}`;
    if (tEnd < tmax) d += ` L${X(tmax)} ${Y(hEnd)}`;
    el('path', { d, fill:'none', stroke:css('--water-d'), 'stroke-width':2.5, 'stroke-dasharray':'6 5', opacity:.7 }, graph);

    // 記録（実線）
    el('path', { d:'M' + S.hist.map(p => `${X(p[0])} ${Y(p[1])}`).join(' L'),
      fill:'none', stroke:css('--water-d'), 'stroke-width':3.5, 'stroke-linejoin':'round' }, graph);
    el('circle', { cx:X(S.t), cy:Y(S.h), r:6, fill:css('--water-d') }, graph);
  }

  /* ---------- 表示 ---------- */
  function sync() {
    $('oIn').textContent = S.qin + ' L';
    $('oOut').textContent = S.qout + ' L';
    $('oW').textContent = S.w + ' cm';
    $('oD').textContent = S.d + ' cm';
    $('oH').textContent = S.H + ' cm';
    $('oI').textContent = S.h0 + ' cm';
    $('h0').max = S.H;
    $('play').textContent = S.playing ? '❚❚ 一時停止' : '▶ スタート';
  }

  function update() {
    $('rH').textContent = S.h.toFixed(1);
    $('rV').textContent = (S.h * area() / 1000).toFixed(1);
    $('rT').textContent = S.t.toFixed(1);
    const diff = S.qin - S.qout, a = net(), st = $('status');
    st.className = 'status ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
    st.textContent = diff > 0 ? `入る量が ${diff} L/分 多い → 水面は上がる`
      : diff < 0 ? `出る量が ${-diff} L/分 多い → 水面は下がる`
      : '入る量 = 出る量 → 水面は変わらない';
    $('eq').innerHTML =
      `1分で ${S.qin} − ${S.qout} = <b>${diff > 0 ? '+' : ''}${+diff.toFixed(1)}</b> L 変化<br>` +
      `底面積 ${S.w}×${S.d} = <b>${area()}</b> cm² → 1分で水面は <b>${a > 0 ? '+' : ''}${a.toFixed(2)}</b> cm<br>` +
      `y = ${a.toFixed(2)}x + ${S.h0}`;
    drawTank();
    drawGraph();
  }

  function restart() {      // 設定を変えたら現在の水位から記録を引き継ぐ
    S.h = Math.min(S.h, S.H);
    S.hist.push([S.t, S.h]);
  }

  function bind(id, key, resetAll) {
    $(id).addEventListener('input', e => {
      S[key] = +e.target.value;
      if (key === 'H') S.h0 = Math.min(S.h0, S.H);
      if (resetAll) reset(); else restart();
      sync(); update();
    });
  }
  function reset() {
    S.t = 0; S.h = S.h0; S.hist = [[0, S.h0]]; S.playing = false;
  }
  bind('qin', 'qin'); bind('qout', 'qout');
  bind('w', 'w', true); bind('d', 'd', true); bind('H', 'H', true); bind('h0', 'h0', true);
  $('play').addEventListener('click', () => { S.playing = !S.playing; sync(); });
  $('reset').addEventListener('click', () => { reset(); sync(); update(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', update);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (S.playing) {
      S.t += dt * SPEED;
      S.h = Math.max(0, Math.min(S.H, S.h + net() * dt * SPEED));
      S.hist.push([S.t, S.h]);
      if (S.hist.length > 4000) S.hist.splice(1, 1);
      update();
    }
    requestAnimationFrame(frame);
  }
  sync(); update();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
